# AGP 8.13.x rather than the current 9.4 line: 9.x requires Gradle 9.6+,
# which conflicts with .circleci/config.yml's pinned "gradle wrapper
# --gradle-version 8.14". AGP 8.13 supports up to API 36.1, which matches
# the compileSdk = 36 decision in PHASE_0_PLATFORM_VALIDATION.md (Play
# Store's own submission requirement, not a preference). Revisit together
# if/when the project intentionally moves to Gradle 9.
[versions]
agp = "8.13.2"
kotlin = "2.3.21"
coroutines = "1.11.0"
junit4 = "4.13.2"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"
room = "2.8.4"
datastore = "1.2.1"
# UNVERIFIED PATCH SUFFIX: KSP versions follow
# "{matching-kotlin-version}-{ksp-patch}". Confirm the exact patch for
# Kotlin 2.3.21 at https://github.com/google/ksp/releases before the
# first real build -- do not trust this value without checking, same
# treatment as the open VPN foreground-service-type item in
# PHASE_0_PLATFORM_VALIDATION.md.
ksp = "2.3.21-2.0.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
